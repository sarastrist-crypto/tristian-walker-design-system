<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Quiet Line — Title Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@400;700&display=swap"
      rel="stylesheet"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <!-- Standalone composition: NO <template> wrapper, per skills/hyperframes/SKILL.md -->
    <div
      id="root"
      data-composition-id="root"
      data-start="0"
      data-duration="5"
      data-track-index="0"
      data-width="1920"
      data-height="1080"
    >
      <div class="scene-content">
        <div class="eyebrow" id="eyebrow">CHAPTER ONE</div>
        <h1 class="title" id="title">
          The
          <span class="mark-wrap"
            ><span class="mark-target">Quiet</span
            ><span class="mark-sweep" aria-hidden="true"></span></span>
          Line
        </h1>
        <p class="subtitle" id="subtitle">
          A reckoning, in three doorways &amp; one long letter home.
        </p>
        <div class="rule" id="rule"></div>
        <div class="byline" id="byline">Tristian Walker</div>
      </div>

      <style>
        [data-composition-id="root"] {
          /* Brand tokens — see colors_and_type.css */
          --bg-parchment: #fdfcf8;
          --accent-primary: #bc744e;
          --accent-soft: rgba(188, 116, 78, 0.18);
          --text-main: #2d2925;
          --text-muted: #5c554d;
          --font-display: "Playfair Display", Georgia, serif;
          --font-body: "Lato", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

          width: 100%;
          height: 100%;
          background: var(--bg-parchment);
          color: var(--text-main);
          font-family: var(--font-body);
          position: relative;
          overflow: hidden;
        }

        [data-composition-id="root"] .scene-content {
          /* End-state layout. No absolute positioning on content. */
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: flex-start;
          width: 100%;
          height: 100%;
          padding: 160px 200px;
          gap: 36px;
          box-sizing: border-box;
        }

        [data-composition-id="root"] .eyebrow {
          font-family: var(--font-body);
          font-weight: 700;
          font-size: 28px;
          letter-spacing: 0.32em;
          color: var(--accent-primary);
          /* room for the entrance to translate Y without affecting layout */
          transform-origin: left center;
        }

        [data-composition-id="root"] .title {
          font-family: var(--font-display);
          font-weight: 600;
          font-size: 184px;
          line-height: 1.02;
          letter-spacing: -0.015em;
          margin: 0;
          color: var(--text-main);
          max-width: 1500px;
        }

        [data-composition-id="root"] .mark-wrap {
          position: relative;
          display: inline-block;
          padding: 0 0.08em;
        }

        [data-composition-id="root"] .mark-target {
          font-style: italic;
          position: relative;
          z-index: 2;
        }

        /* Marker sweep — pure CSS-driven layer, GSAP scales clipPath via inline style */
        [data-composition-id="root"] .mark-sweep {
          position: absolute;
          inset: 12% -2% 8% -2%;
          background: var(--accent-soft);
          border-radius: 6px;
          z-index: 1;
          transform-origin: left center;
          transform: scaleX(0);
          will-change: transform;
        }

        [data-composition-id="root"] .subtitle {
          font-family: var(--font-display);
          font-style: italic;
          font-weight: 400;
          font-size: 42px;
          line-height: 1.4;
          margin: 0;
          color: var(--text-muted);
          max-width: 1300px;
        }

        [data-composition-id="root"] .rule {
          width: 180px;
          height: 4px;
          background: var(--accent-primary);
          margin-top: 18px;
          transform-origin: left center;
        }

        [data-composition-id="root"] .byline {
          font-family: var(--font-body);
          font-weight: 400;
          font-size: 26px;
          letter-spacing: 0.22em;
          text-transform: uppercase;
          color: var(--text-muted);
        }
      </style>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        // Timeline contract: paused, registered on window.__timelines, built synchronously.
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Entrance choreography — 5 elements, 5 different eases.
        // First tween offset 0.25s per Animation Guardrails ("not t=0").
        tl.from("#eyebrow", { y: 24, opacity: 0, duration: 0.55, ease: "power3.out" }, 0.25);
        tl.from("#title", { y: 60, opacity: 0, duration: 0.85, ease: "expo.out" }, 0.45);
        tl.to(".mark-sweep", { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, 1.35);
        tl.from("#subtitle", { y: 28, opacity: 0, duration: 0.65, ease: "power2.out" }, 1.55);
        tl.from("#rule", { scaleX: 0, duration: 0.55, ease: "back.out(1.6)" }, 1.95);
        tl.from("#byline", { y: 18, opacity: 0, duration: 0.5, ease: "sine.out" }, 2.2);

        // NO exit tweens — single-scene title card, transition (if any) would handle exit.

        window.__timelines["root"] = tl;
      </script>
    </div>
  </body>
</html>
