<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<main class="card-root">
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;">
    <div>
      <div class="swatch" style="height:90px;background:#BC744E;box-shadow:var(--shadow-sm);"></div>
      <div style="margin-top:8px;font-size:12px;font-weight:700;color:var(--text-main);">Burnt Sienna</div>
      <div class="mono-label">#BC744E · --accent-primary</div>
    </div>
    <div>
      <div class="swatch" style="height:90px;background:#A05E3D;"></div>
      <div style="margin-top:8px;font-size:12px;font-weight:700;">Sienna Hover</div>
      <div class="mono-label">#A05E3D · --accent-hover</div>
    </div>
    <div>
      <div class="swatch" style="height:90px;background:#C4A484;"></div>
      <div style="margin-top:8px;font-size:12px;font-weight:700;">Warm Tan</div>
      <div class="mono-label">#C4A484 · --accent-tan</div>
    </div>
    <div>
      <div class="swatch" style="height:90px;background:#E6DFD6;border:1px solid rgba(0,0,0,0.05);"></div>
      <div style="margin-top:8px;font-size:12px;font-weight:700;">Cashmere</div>
      <div class="mono-label">#E6DFD6 · --bg-warm</div>
    </div>
  </div>
</main>
</body></html>
