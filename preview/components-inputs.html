<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card-root">
  <form style="display:flex;gap:10px;align-items:stretch;">
    <input type="email" placeholder="Enter your email" style="flex:1;padding:14px 18px;border:1.5px solid #ddd;border-radius:6px;font-family:'Lato',sans-serif;font-size:14px;background:#fff;outline:none;">
    <button type="button" style="background:#BC744E;color:#fff;padding:14px 24px;border:none;border-radius:6px;font-family:'Lato',sans-serif;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 4px 12px rgba(188,116,78,0.25);">Send Me Chapter One</button>
  </form>
  <div style="margin-top:14px;">
    <input type="text" value="Focused state (sienna ring)" style="width:100%;padding:14px 18px;border:1.5px solid #BC744E;border-radius:6px;font-family:'Lato',sans-serif;font-size:14px;background:#fff;outline:none;box-shadow:0 0 0 3px rgba(188,116,78,0.12);color:#2D2925;">
  </div>
  <div style="margin-top:10px;font-family:'Lato',sans-serif;font-size:10px;color:#8B8478;">Inputs: 1.5px border · 6px radius · accent-soft focus ring</div>
</div>
