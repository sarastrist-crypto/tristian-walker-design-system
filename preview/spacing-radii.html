<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card-root">
  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:14px;align-items:end;">
    <div style="text-align:center;">
      <div style="width:64px;height:64px;background:#BC744E;border-radius:6px;margin:0 auto;"></div>
      <div class="mono-label" style="margin-top:8px;">6px</div>
      <div style="font-size:10px;font-weight:700;">radius-sm</div>
      <div style="font-size:9px;color:#8B8478;">buttons, inputs</div>
    </div>
    <div style="text-align:center;">
      <div style="width:64px;height:64px;background:#BC744E;border-radius:12px;margin:0 auto;"></div>
      <div class="mono-label" style="margin-top:8px;">12px</div>
      <div style="font-size:10px;font-weight:700;">radius-md</div>
      <div style="font-size:9px;color:#8B8478;">cards</div>
    </div>
    <div style="text-align:center;">
      <div style="width:64px;height:64px;background:#BC744E;border-radius:16px;margin:0 auto;"></div>
      <div class="mono-label" style="margin-top:8px;">16px</div>
      <div style="font-size:10px;font-weight:700;">radius-lg</div>
      <div style="font-size:9px;color:#8B8478;">feature cards</div>
    </div>
    <div style="text-align:center;">
      <div style="width:64px;height:64px;background:#BC744E;border-radius:32px;margin:0 auto;"></div>
      <div class="mono-label" style="margin-top:8px;">32px</div>
      <div style="font-size:10px;font-weight:700;">radius-xl</div>
      <div style="font-size:9px;color:#8B8478;">glass panels</div>
    </div>
    <div style="text-align:center;">
      <div style="width:120px;height:40px;background:#BC744E;border-radius:100px;margin:0 auto;"></div>
      <div class="mono-label" style="margin-top:8px;">100px</div>
      <div style="font-size:10px;font-weight:700;">radius-pill</div>
      <div style="font-size:9px;color:#8B8478;">tags</div>
    </div>
  </div>
</div>
</body></html>
